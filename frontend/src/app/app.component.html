<div class="app-container">

  <!-- Page header -->
  <header class="page-header">
    <h1>Expense Tracker</h1>
    <p>Manage and track your expenses easily.</p>
  </header>

  <!-- Expense form -->
  <section class="card">
    <app-expense-form
      [expenseToEdit]="selectedExpense"
      (expenseCreated)="onExpenseChanged()"
      (expenseUpdated)="onExpenseChanged()"
      (editCancelled)="onEditCancelled()">
    </app-expense-form>
  </section>

  <!-- Expense summary -->
  <section class="card">
    <app-expense-summary>
    </app-expense-summary>
  </section>

  <!-- Expense list -->
  <section class="card">
    <app-expense-list
      (expenseEdit)="onExpenseEdit($event)">
    </app-expense-list>
  </section>

</div>
