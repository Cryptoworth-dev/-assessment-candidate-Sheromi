<!--
  AppComponent is the main application shell.

  ExpenseFormComponent is responsible for:
  - Collecting expense information
  - Validating the form
  - Creating new expenses

  ExpenseListComponent is responsible for:
  - Fetching expenses
  - Storing expenses
  - Displaying the expense table
-->

<!--
  Listen for the expenseCreated event from the form.
  When an expense is successfully created,
  call onExpenseCreated() in AppComponent.
-->
<app-expense-form
  (expenseCreated)="onExpenseCreated()">
</app-expense-form>

<!-- Expense list -->
<app-expense-list></app-expense-list>
