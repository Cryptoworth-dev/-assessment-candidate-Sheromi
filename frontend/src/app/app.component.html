<!--
  AppComponent is the main application shell.

  ExpenseFormComponent is responsible for:
  - Collecting expense information
  - Validating the form
  - Creating new expenses

  ExpenseListComponent is responsible for:
  - Fetching expenses
  - Storing expenses
  - Displaying the expense table
-->

<!-- Expense creation/editing form --> 
<app-expense-form 
    [expenseToEdit]="selectedExpense" 
    (expenseCreated)="onExpenseChanged()" 
    (expenseUpdated)="onExpenseChanged()" 
    (editCancelled)="onEditCancelled()"> 
</app-expense-form> 

<!-- Expense list --> 
<app-expense-list 
    (expenseEdit)="onExpenseEdit($event)"> 
</app-expense-list>

<!-- Expense summary -->
<app-expense-summary>
    
</app-expense-summary>
