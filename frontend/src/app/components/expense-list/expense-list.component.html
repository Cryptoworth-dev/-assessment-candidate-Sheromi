<!-- Expense List -->
<div class="expense-container">

  <!-- Page heading -->
  <h2>Expenses</h2>

  <!-- Expense table -->
  <table>

    <!-- Table header -->
    <thead>
      <tr>
        <th>ID</th>
        <th>Amount</th>
        <th>Category</th>
        <th>Description</th>
        <th>Date</th>
        <th>Actions</th>
      </tr>
    </thead>

    <!-- Table body -->
    <tbody>

      <!--
        Loop through every expense.
        track expense.id helps Angular efficiently update the list.
      -->
      @for (expense of expenses; track expense.id) {

        <tr>

          <!-- Expense ID -->
          <td>{{ expense.id }}</td>

          <!-- Expense amount -->
          <td>{{ expense.amount }}</td>

          <!-- Expense category -->
          <td>{{ expense.category }}</td>

          <!-- Expense description -->
          <td>{{ expense.description }}</td>

          <!-- Expense date -->
          <td>{{ expense.expense_date }}</td>

          <!-- Expense actions -->
          <td>
            <button
              type="button"
              (click)="editExpense(expense)">
              Edit
            </button>
            
            <button
              type="button"
              (click)="deleteExpense(expense.id)">
              Delete
            </button>
          </td>

        </tr>

      } @empty {

        <!-- Displayed when there are no expenses -->
        <tr>
          <td colspan="6">No expenses found.</td>
        </tr>

      }

    </tbody>
  </table>

</div>
